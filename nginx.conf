server {
    listen 80;
    server_name noxara.page;
    root /www/wwwroot/noxara.page;
    index index.php index.html;

    charset utf-8;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Block access to sensitive directories
    location ~ ^/(config|includes|logs|backups|database|\.git)/ {
        deny all;
        return 403;
    }

    # Block PHP execution in uploads
    location ~* /uploads/.*\.php$ {
        deny all;
        return 403;
    }

    # Static asset caching (30 days)
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Pretty error pages
    error_page 404 /errors/404.php;
    error_page 500 502 503 504 /errors/500.php;

    # Main location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    # Deny dotfiles (except .well-known)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Access & Error logs
    access_log /www/wwwlogs/noxara.page.log;
    error_log /www/wwwlogs/noxara.page.error.log;
}
