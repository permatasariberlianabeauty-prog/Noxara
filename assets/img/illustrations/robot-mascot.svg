<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="robot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7B2FFF;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Antenna -->
  <line x1="100" y1="35" x2="100" y2="50" stroke="url(#robot-grad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="32" r="5" fill="url(#robot-grad)"/>
  <!-- Head -->
  <rect x="65" y="50" width="70" height="55" rx="12" fill="#0F1629" stroke="url(#robot-grad)" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="82" cy="75" r="8" fill="#1A2238"/>
  <circle cx="82" cy="75" r="4" fill="#00D4FF"/>
  <circle cx="118" cy="75" r="8" fill="#1A2238"/>
  <circle cx="118" cy="75" r="4" fill="#00D4FF"/>
  <!-- Mouth -->
  <rect x="85" y="90" width="30" height="6" rx="3" fill="#1A2238"/>
  <rect x="88" y="91" width="6" height="4" rx="2" fill="#00D4FF" opacity="0.6"/>
  <rect x="97" y="91" width="6" height="4" rx="2" fill="#7B2FFF" opacity="0.6"/>
  <rect x="106" y="91" width="6" height="4" rx="2" fill="#FFD700" opacity="0.6"/>
  <!-- Body -->
  <rect x="72" y="110" width="56" height="50" rx="10" fill="#0F1629" stroke="rgba(0,212,255,0.3)" stroke-width="2"/>
  <!-- Chest light -->
  <circle cx="100" cy="130" r="8" fill="#1A2238"/>
  <circle cx="100" cy="130" r="4" fill="url(#robot-grad)" opacity="0.8"/>
  <!-- Arms -->
  <rect x="50" y="115" width="18" height="8" rx="4" fill="#0F1629" stroke="rgba(0,212,255,0.2)" stroke-width="1.5"/>
  <rect x="132" y="115" width="18" height="8" rx="4" fill="#0F1629" stroke="rgba(0,212,255,0.2)" stroke-width="1.5"/>
  <!-- Legs -->
  <rect x="82" y="160" width="12" height="20" rx="6" fill="#0F1629" stroke="rgba(0,212,255,0.2)" stroke-width="1.5"/>
  <rect x="106" y="160" width="12" height="20" rx="6" fill="#0F1629" stroke="rgba(0,212,255,0.2)" stroke-width="1.5"/>
</svg>
